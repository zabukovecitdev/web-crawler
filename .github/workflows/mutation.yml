name: Mutation tests

# Runs Stryker.NET on SamoBot.Core weekly (and on demand) and uploads the report.
# Report only: the score never fails the run.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/SamoBot.Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tools
        run: dotnet tool restore
      - name: Mutate SamoBot.Core
        run: dotnet tool run dotnet-stryker
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: src/SamoBot.Tests/StrykerOutput/**/reports/
