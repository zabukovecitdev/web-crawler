# Production on a single host: a TLS edge (Caddy) in front of the stack in compose.yaml. Run with
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Needs Docker Compose 2.24.4 or newer (`!reset`). Set DOMAIN and the secrets below in .env first (README, "Production").
#
# What changes compared with compose.yaml:
#   - Only Caddy publishes ports (80 and 443). The dashboard, API, database, storage and search are
#     reachable only on the compose network, so every request passes the rate limits in nginx.
#   - The session cookie is Secure and CORS allows exactly https://$DOMAIN.
#   - The development defaults for passwords and keys are refused: compose stops when one is unset.
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public host name of the dashboard, e.g. crawler.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      Auth__AllowInsecureCookie: "false"
      Cors__Origins__0: https://${DOMAIN}

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (no ; = or spaces)}

  rustfs:
    ports: !reset []
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}

  meilisearch:
    ports: !reset []
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY, at least 16 bytes}

volumes:
  caddy_data: {}
  caddy_config: {}
