# SamoBot: PostgreSQL is the only queue. Run with:
#   DASHBOARD_API_KEY=<secret> docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: samobot
      POSTGRES_USER: samobot
      POSTGRES_PASSWORD: samobot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samobot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - rustfs_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - meilisearch_data:/meili_data

  migrations:
    image: samobot-migrations
    build:
      context: .
      dockerfile: src/SamoBot.Migrations/Dockerfile
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=samobot;Username=samobot;Password=samobot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    image: samobot-worker
    build:
      context: .
      dockerfile: src/SamoBot.Worker/Dockerfile
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=samobot;Username=samobot;Password=samobot
      MinIO__Endpoint: rustfs
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      Meilisearch__Host: http://meilisearch:7700
      Meilisearch__ApiKey: masterKey
    depends_on:
      migrations:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: samobot-api
    build:
      context: .
      dockerfile: src/SamoBot.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=samobot;Username=samobot;Password=samobot
      DashboardApi__Key: ${DASHBOARD_API_KEY:?Set DASHBOARD_API_KEY to the dashboard API key}
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
  meilisearch_data:
