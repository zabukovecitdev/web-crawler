# Loaded at http level (the Dockerfile copies this to /etc/nginx/conf.d/00-limits.conf, before default.conf).
#
# Rate limiting is a leaky bucket per client address: `rate` is how fast the bucket drains, `burst` how
# many requests it holds on top. With `nodelay` a burst is served at once and anything beyond it is
# refused with 429, so a client that is over its budget never ties up a connection waiting in a queue.
# The API repeats a looser version of these limits as a backstop and adds what only it can know
# (per signed-in user, wrong API keys).

# ---- Real client address -------------------------------------------------------------------------
# Behind a TLS proxy (see compose.prod.yaml) the peer is the proxy, so every client would share one bucket.
# Trust X-Forwarded-For only from private networks, i.e. the proxy on the compose network. Never publish
# this container's port to the internet directly: a direct client could then forge the header.
# Behind a cloud load balancer or CDN, add its address ranges with more set_real_ip_from lines.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---- Zones -----------------------------------------------------------------------------------------
# 10m of state holds roughly 160 000 addresses; when it is full the oldest entries are dropped.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;      # everything under /api/
limit_req_zone $binary_remote_addr zone=signin:10m rate=6r/m;    # POST /api/v1/auth/google
limit_req_zone $binary_remote_addr zone=hub:10m rate=1r/s;       # SignalR negotiate and connect
limit_conn_zone $binary_remote_addr zone=hubconn:10m;            # open hub connections

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# What the API forwards as the protocol: the edge's answer when there is one, otherwise our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
