map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Keep the browser's Host (with port): the API compares Origin with its own origin.
    proxy_set_header Host $http_host;
    # The API rate-limits per client address and trusts this header only from private networks.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # SignalR: WebSocket upgrade and long-lived connections.
    location /hubs/ {
        proxy_pass http://api:8080;
        # A location with its own proxy_set_header does not inherit the server-level ones.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every asset name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
