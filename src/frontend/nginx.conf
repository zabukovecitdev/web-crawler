map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The protocol the browser used: a TLS proxy in front says so, otherwise it is our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Behind a TLS proxy or load balancer the peer is the proxy: take the real client from X-Forwarded-For,
    # but only when the proxy is on a private network. A client that reaches this port directly cannot forge
    # it, as long as the port is not published to the internet. For a proxy outside these ranges (a CDN),
    # add its ranges with more set_real_ip_from lines.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Keep the browser's Host (with port): the API compares Origin with its own origin.
    proxy_set_header Host $http_host;
    # $remote_addr is the real client (see above). The API rate-limits on it and trusts these headers
    # only from private networks.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # SignalR: WebSocket upgrade and long-lived connections.
    location /hubs/ {
        proxy_pass http://api:8080;
        # A location with its own proxy_set_header does not inherit the server-level ones.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every asset name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
