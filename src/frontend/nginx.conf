map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Keep the browser's Host (with port): the API compares Origin with its own origin.
    proxy_set_header Host $http_host;
    # $remote_addr is already the real client (see nginx-limits.conf); the API limits on it too.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;

    # Rate limits live in nginx-limits.conf (zones) and here (which location uses which zone).
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"title":"Too many requests","status":429,"detail":"Slow down and retry in 10 seconds."}';
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:8080;
    }

    # Sign-in validates a Google token on every call. Six a minute per address, a burst of four.
    # `=` matches only this path, ahead of /api/. The location repeats proxy_pass, not the headers.
    location = /api/v1/auth/google {
        limit_req zone=api burst=50 nodelay;
        limit_req zone=signin burst=3 nodelay;
        proxy_pass http://api:8080;
    }

    # SignalR: WebSocket upgrade and long-lived connections.
    location /hubs/ {
        limit_req zone=hub burst=10 nodelay;
        limit_conn hubconn 20;
        proxy_pass http://api:8080;
        # A location with its own proxy_set_header does not inherit the server-level ones.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every asset name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
